[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expedantic"
version = "0.3.0"
description = ""
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "rnilva", email = "rnilva849@gmail.com" },
]
keywords = []
dependencies = [
    "pydantic >= 2.10.5",
    "pydantic_yaml >= 1.3.0",
    "rich >= 13.7.1",
    "typed-argument-parser",
]

[project.optional-dependencies]
# Only needed for LoggerBase.to_dataframe() / .save(); logging itself has no
# third-party dependencies.
dataframe = [
    "polars >= 0.18.0",
]

[project.urls]
Homepage = "https://github.com/rnilva/expedantic"

[tool.hatch.build.targets.wheel]
packages =  ["src/expedantic", "submodules/ccorp_yaml_include/ccorp"]
